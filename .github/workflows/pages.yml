name: Publish readings website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check internal links and page structure
        run: python3 scripts/check_site.py

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Test Chapters 1–4 examples
        run: examples/chapters-01-04/gradlew -p examples/chapters-01-04 --no-daemon test

      - name: Test Chapters 5–6 examples
        run: examples/chapters-01-04/gradlew -p examples/chapters-05-06 --no-daemon test

      - name: Compile stack examples
        run: |
          mkdir -p "$RUNNER_TEMP/cpen221-stack-examples"
          javac -Xlint:all -d "$RUNNER_TEMP/cpen221-stack-examples" \
            examples/how-java-runs/FrameDemo.java \
            examples/beyond-java-call-stack/BytecodeDemo.java

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

