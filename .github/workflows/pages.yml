name: Publish readings website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Layout can change between pandoc releases, so the version that rendered the
      # committed pages is pinned in scripts/site_contract.py and installed here.
      - name: Install the pinned pandoc
        run: |
          version="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import site_contract; print(site_contract.PANDOC_VERSION)')"
          curl --fail --location --silent --show-error \
            "https://github.com/jgm/pandoc/releases/download/${version}/pandoc-${version}-1-amd64.deb" \
            --output "$RUNNER_TEMP/pandoc.deb"
          sudo dpkg --install "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1

      # The published repository holds both the Markdown under sources/ and the HTML
      # generated from it. Rebuilding here and refusing any difference proves that the
      # committed pages are what the committed sources produce, so a forgotten local
      # build cannot reach the site.
      - name: Rebuild the site and refuse any difference
        run: |
          python3 scripts/build_site.py
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "::error::The committed pages differ from a rebuild of the committed sources. Run python3 scripts/build_site.py and commit the result."
            echo "$changes"
            git diff --stat
            exit 1
          fi
          echo "The committed pages match a rebuild of the committed sources."

      - name: Check internal links and page structure
        run: python3 scripts/check_site.py

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Test chapter examples
        run: |
          for project in \
            engineering-reliable-software \
            types-and-specifications \
            exceptions-testing-and-evidence \
            mutability-aliasing-and-debugging \
            adts-and-representation-independence \
            representation-invariants-and-abstraction-functions \
            equality-hashing-and-behavioural-subtyping \
            composition-delegation-and-api-design \
            recursion-and-recursive-datatypes \
            functions-streams-and-data-transformations \
            systems-model-and-network-protocols \
            parallelism-concurrency-and-virtual-threads \
            thread-safety-integration-and-reliability
          do
            "examples/$project/gradlew" -p "examples/$project" --no-daemon test
          done

      - name: Compile stack examples
        run: |
          mkdir -p "$RUNNER_TEMP/cpen221-stack-examples"
          javac -Xlint:all -d "$RUNNER_TEMP/cpen221-stack-examples" \
            examples/how-java-runs/FrameDemo.java \
            examples/beyond-java-call-stack/BytecodeDemo.java

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
